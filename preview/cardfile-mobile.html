<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nomiqo mobile preview</title>
  <style>
    :root { color-scheme: light dark; --bg: #e7ebf2; --ink: #131a26; --muted: #5b677a; --accent: #2b55e0; --frame: #10141c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0b0f16; --ink: #e9eef6; --muted: #94a1b6; --accent: #7c9cff; --frame: #000; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
      display: grid; place-items: center; padding: 24px 16px; }
    .wrap { display: grid; gap: 18px; justify-items: center; }
    .phone { width: 414px; height: 904px; max-width: calc(100vw - 32px); padding: 48px 12px 12px; border-radius: 56px; background: var(--frame);
      box-shadow: 0 30px 80px rgba(0,0,0,.35), inset 0 0 0 2px #2a2f3a; position: relative; }
    .phone::before { content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 110px; height: 24px; border-radius: 20px; background: #000; box-shadow: inset 0 0 0 1px #222; }
    iframe { width: 100%; height: 100%; border: 0; border-radius: 6px 6px 44px 44px; background: #fff; display: block; }
    h1 { margin: 0; font-size: 18px; }
    p { margin: 0; color: var(--muted); font-size: 14px; text-align: center; }
    a { color: var(--accent); font-weight: 600; }
    @media (max-width: 500px) { body { padding: 0; } .phone { width: 100vw; height: 100vh; max-width: none; padding: 0; border-radius: 0; box-shadow: none; } .phone::before { display: none; } iframe { border-radius: 0; } .wrap > :not(.phone) { display: none; } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Nomiqo on a phone (390 × 844)</h1>
    <div class="phone"><iframe src="cardfile-preview.html" title="Nomiqo app preview" width="390" height="844"></iframe></div>
    <p>Sample data only; nothing is saved. <a href="cardfile-preview.html" target="_blank" rel="noopener">Open full screen</a></p>
  </div>
</body>
</html>
